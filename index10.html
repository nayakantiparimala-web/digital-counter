<!DOCTYPE html>
<html>
<head>
    <title>Digital Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .counter {
            width: 350px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        #count {
            font-size: 60px;
            margin: 20px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            font-size: 18px;
            border: none;
            background: black;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="counter">
        <h1>Digital Counter</h1>

        <div id="count">0</div>

        <button onclick="decrease()">-</button>
        <button onclick="resetCount()">Reset</button>
        <button onclick="increase()">+</button>
    </div>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").innerText = count;
        }

        function resetCount() {
            count = 0;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>
</html>
